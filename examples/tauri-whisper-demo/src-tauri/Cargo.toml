[package]
name = "tauri-whisper-demo"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "tauri_whisper_demo_lib"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-whisper = { path = "../../..", features = ["full"] }
cpal = "0.15"
rubato = "0.16"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol", "full"]
custom-protocol = ["tauri/custom-protocol"]
metal = ["tauri-plugin-whisper/metal"]
cuda = ["tauri-plugin-whisper/cuda"]
diarization = ["tauri-plugin-whisper/diarization"]
screencapturekit = ["tauri-plugin-whisper/screencapturekit"]
vad = ["tauri-plugin-whisper/vad"]
full = ["metal", "diarization", "screencapturekit", "vad"]
